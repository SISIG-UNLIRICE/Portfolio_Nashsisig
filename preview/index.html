.hero-content { position:relative; display: grid; grid-template-columns: minmax(290px,.92fr) minmax(340px,1.08fr); min-height: calc(100svh - var(--nav-height)); max-width: 1640px; margin: auto; gap: clamp(60px,8vw,130px); padding: clamp(80px,11vh,120px) 65px; align-items: center; }

/* Flat portrait inside clear collegiate PVC badge, matching user's ID reference. */
.lanyard {
  /* The real reference geometry: badge top 325px below the navbar and
     a 350px fabric strap reaching 5px behind its bottom edge. */
  position: absolute;
  top: calc(var(--nav-height) + 325px);
  left: 28.5%;
  width: 242px;
  margin: 0;
  z-index: 4;
  transform: translateX(-50%);
}

.lanyard-strap-side--left {left:26px;transform:rotate(-4deg);transform-origin:50% 0;}
.lanyard-strap-side--right {right:26px;transform:rotate(4deg);transform-origin:50% 0;}
.lanyard-buckle {position:absolute;z-index:3;top:245px;left:37px;width:36px;height:39px;border:2px solid #34414b;border-radius:3px 3px 5px 5px;background:linear-gradient(90deg,#111820 2%,#354249 48%,#121b24 97%);box-shadow:inset 0 0 0 1px #eef2f222,0 2px 5px #0009;}
.lanyard-buckle::after {content:'';position:absolute;bottom:7px;left:5px;right:5px;height:3px;background:#768185;box-shadow:0 -5px #283943;}

.lanyard-clip-logo {border:1px solid #89641a;border-radius:50%;color:#52420f;font:bold 8px Georgia,serif;height:22px;width:22px;display:grid;place-items:center;}
.lanyard-ring {position:absolute;z-index:6;top:-30px;left:calc(50% - 7px);height:41px;width:14px;border:3px solid #a6b2b6;border-radius:9px;box-shadow:inset 0 0 0 2px #15181b,1px 0 3px #0009;}
.lanyard-ring::after {content:'';position:absolute;bottom:-5px;left:3px;height:12px;width:3px;border-radius:3px;background:#596568;}
 .id-panel {position:relative;width:100%;aspect-ratio:.66;padding:37px 8px 8px;border:2px solid #b0b9b9;background:linear-gradient(108deg,#d1d9d9d9 0%,#8e989bc9 7%,#eef3f0c9 21%,#949ca2b8 45%,#e9ece6cf 81%,#a3b0b4d6 100%);box-shadow:0 15px 27px #0009,0 2px 4px #0008,inset 0 0 0 3px #edf1f388,inset 0 0 10px #f5f7ff99;border-radius:20px 20px 11px 11px;clip-path:polygon(0 12%,2% 10.6%,8% 10%,15% 8.7%,21% 5.2%,27% 1.6%,31% 0,69% 0,73% 1.6%,79% 5.2%,85% 8.7%,92% 10%,98% 10.6%,100% 12%,100% 100%,0 100%);}

.id-paper {position:relative;width:100%;height:100%;padding:7px 5px 6px;border:2px solid #9cb5d7;border-radius:4px;display:flex;flex-direction:column;align-items:center;overflow:hidden;color:#142c57;background:linear-gradient(153deg,#f8faff 0%,#d8e6ff 56%,#a9d2ff 100%);box-shadow:0 0 0 1px #ffffff99,inset 0 0 9px #75a3dc55;font-family:Arial,Helvetica,sans-serif;}
.id-paper::before {content:'';position:absolute;z-index:0;inset:18% -48% 0 -45%;background:repeating-radial-gradient(ellipse at 57% 53%,transparent 0 16px,#3b89e12b 17px 20px,transparent 22px 41px),linear-gradient(130deg,transparent 33%,#76aeeb22 35%,transparent 39%);transform:rotate(23deg);pointer-events:none;}

/* Full-bleed identity card artwork: match the supplied close-up at every badge width.

.about { min-height: 100svh; width: 100%; padding: clamp(60px,10vh,120px) clamp(24px,7vw,140px); position: relative; display: flex; flex-direction: column; justify-content: center; background: radial-gradient(circle at 85% 20%,rgba(35,23,91,.22),transparent 34%),#17141d; overflow: hidden; }

/* Photo preview (3D expanding/tilting) */
